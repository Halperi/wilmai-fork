name: home-android
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/home/**"
      - "packages/wilma-client/**"
      - ".github/workflows/home-android.yml"
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/home/src-tauri
          key: android-arm64
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: apps/home
      - run: pnpm typecheck && TZ=UTC pnpm exec tsx --test evals/*.test.ts
        working-directory: apps/home
      - run: pnpm android:init && pnpm android:build:debug --ci
        working-directory: apps/home
      - uses: actions/upload-artifact@v4
        with:
          name: wilmai-home-android-arm64-debug
          path: apps/home/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
