name: home-ios

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/home/**"
      - "packages/wilma-client/**"
      - ".github/workflows/home-ios.yml"

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/home/src-tauri
          key: ios-simulator
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: apps/home
      - run: pnpm typecheck && TZ=UTC pnpm test:mobile
        working-directory: apps/home
      - run: brew install xcodegen libimobiledevice cocoapods
      - run: pnpm ios:init --ci && pnpm ios:build --ci
        working-directory: apps/home
      - uses: actions/upload-artifact@v4
        with:
          name: wilmai-home-ios-simulator
          path: apps/home/src-tauri/gen/apple/build/**/WilmAI*.app
          if-no-files-found: error
